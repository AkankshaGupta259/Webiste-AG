# Render Blueprint for the FastAPI backend.
# In Render: New → Blueprint → connect this repo. It reads this file.
# Secrets (marked sync:false) are set once in the Render dashboard — they
# are NEVER committed here.
services:
  - type: web
    name: portfolio-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.2"
      # --- Secrets: set these in the Render dashboard (sync:false) ---
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      # Your production frontend origins (Vercel URL + custom domain),
      # comma-separated. Update after the frontend is deployed.
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
